name: Deploy

# Publishes the generated Bicep for both environments (as a reviewable artifact), then deploys
# staging and — once staging succeeds — production. Gate either one behind reviewers by adding
# required reviewers to the matching GitHub Environment (Settings → Environments); the jobs
# already declare `environment:`, so no workflow change is needed.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy a single environment (leave as "both" for the full staging → production run)
        type: choice
        options: [both, staging, production]
        default: both

permissions:
  id-token: write   # OIDC federated login to Azure — no client secrets
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  # ONE source of truth for the build number, computed once and passed to every other job.
  # GitHub has no built-in build counter like ADO's Build.BuildId; `github.run_number` is the
  # closest equivalent — it increments per workflow and, unlike `run_attempt`, is STABLE across
  # re-runs of the same run. That stability matters here: production promotes the image staging
  # pushed, so a re-run of production alone must resolve to the same tag or it would point at an
  # image nobody published.
  #
  #   {date}.{run_number}   e.g. 2026.09.02.42
  #
  #     date        sorts chronologically and is readable at a glance in the registry
  #     run_number  monotonic per workflow, so builds order unambiguously within a day
  #
  # The commit isn't in the tag — the run summary and the workflow run record that. Computing the
  # tag in its own job rather than per-job is what keeps it identical across an approval gate that
  # may hold production until the next day.
  version:
    name: Build number
    runs-on: ubuntu-latest
    outputs:
      build-number: ${{ steps.compute.outputs.build-number }}
      image-tag: ${{ steps.compute.outputs.image-tag }}
    steps:
      - id: compute
        run: |
          set -euo pipefail
          BUILD_NUMBER="${{ github.run_number }}"
          IMAGE_TAG="$(date -u +%Y.%m.%d).${BUILD_NUMBER}"
          echo "build-number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "image-tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          {
            echo "| | |"
            echo "|---|---|"
            echo "| Build number | \`$BUILD_NUMBER\` |"
            echo "| Image tag | \`$IMAGE_TAG\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Builds and pushes both images ONCE, for every environment to share. `aspire do push` stops at
  # the push — build → ACR login → push — so nothing is provisioned or deployed here.
  #
  # `-e staging` is arbitrary: the image names are env-agnostic by design (`{app}-server`,
  # `{app}-webfrontend` — no environment in the resource name), so one build promotes everywhere.
  # The environment only selects which appsettings the AppHost reads to find the registry.
  build-push:
    name: Build and push images
    needs: version
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4 — must precede the local composite action below
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-aspire
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - name: Build and push
        run: aspire do push -e staging --non-interactive -- --Parameters:image-tag=${{ needs.version.outputs.image-tag }}
        env:
          Azure__CredentialSource: AzureCli

  # Renders main.bicep + the per-resource modules for every environment and uploads them.
  # Staging doesn't consume the artifact (`aspire deploy` regenerates the templates itself), but
  # deploy-production applies this exact output — so the build number has to be baked in here too,
  # since publish-time values like ASPIRE_DEPLOY_STAMP are frozen into the templates.
  publish-bicep:
    name: Publish Bicep (${{ matrix.environment }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    steps:
      # actions/checkout@v4 — must precede the local composite action below
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-aspire
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      # setup-aspire logs in to Azure as well, and that isn't optional for publish: the AppHost
      # probes Azure while generating templates (does the ACA environment exist? is the resource
      # group mid-deletion? who is the deploying principal?), so without a login the generated
      # Bicep would not match what deploys.
      - name: Publish Bicep
        run: aspire publish -e ${{ matrix.environment }} --non-interactive -o ./artifacts -- --Parameters:image-tag=${{ needs.version.outputs.image-tag }}
        env:
          Azure__CredentialSource: AzureCli

      # actions/upload-artifact@v4 — pin to a SHA like the actions above if you enforce that.
      - uses: actions/upload-artifact@v4
        with:
          name: bicep-${{ matrix.environment }}
          path: ./artifacts
          retention-days: 30

  deploy-staging:
    name: Deploy staging
    needs: [version, publish-bicep, build-push]
    if: inputs.environment != 'production'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      # actions/checkout@v4 — must precede the local composite action below
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-aspire
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      # Provisions the Bicep and deploys the container apps — WITHOUT rebuilding.
      # skip-image-build trims every build/push step out of the pipeline graph, so this deploys
      # the images `build-push` already pushed under the same tag. Confirm the trim any time with:
      #   aspire deploy --list-steps -e staging -- --Parameters:skip-image-build=true
      # A runner starts with no Aspire deployment state, so every value resolves from
      # appsettings.{env}.json; nothing is cached between runs.
      - name: Deploy
        run: aspire deploy -e staging --non-interactive -- --Parameters:image-tag=${{ needs.version.outputs.image-tag }} --Parameters:skip-image-build=true
        env:
          Azure__CredentialSource: AzureCli

  # PRODUCTION IS THE CONTRAST: no Aspire, no .NET, no Docker, not even a checkout of this repo.
  # It takes the Bicep artifact `publish-bicep` produced and applies it with plain `az`, which is
  # what a hand-off to a separate release tool (Octopus, ADO release stage, a platform team) looks
  # like. Everything `aspire deploy` was doing for staging implicitly, this job has to do out in
  # the open — see "Deploying the published Bicep" in deploy/README.md for the full list.
  deploy-production:
    name: Deploy production (from published Bicep)
    needs: [version, publish-bicep, build-push, deploy-staging]
    # Runs after staging on push; a manual run can target production directly.
    if: always() && inputs.environment != 'staging' && (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped') && needs.publish-bicep.result == 'success' && needs.build-push.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # DRAWBACK #1: `aspire publish` emits templates but no parameters file, and the artifact
      # doesn't carry the config it was generated from. Every value the AppHost resolved from
      # appsettings.json has to be re-supplied here by hand — and silently drifts if that file
      # changes.
      RESOURCE_GROUP: brett-aspire-demo-production
      LOCATION: eastus2
      ACR_NAME: bgoldmandemo
      ACR_RG: brett-demo-resources
      ACR_SUBSCRIPTION: 82a8659c-720d-48ab-a58e-bdaa5d42c92a
      SERVER_CONTAINER_PORT: "8080"
      TARGET_SUBSCRIPTION: ${{ secrets.SUBSCRIPTION_ID }}
      BUILD_NUMBER: ${{ needs.version.outputs.build-number }}
      IMAGE_TAG: ${{ needs.version.outputs.image-tag }}
    steps:
      # No checkout: this job consumes the artifact, not the source.
      - name: Download published Bicep
        # actions/download-artifact@v4
        uses: actions/download-artifact@v4
        with:
          name: bicep-production
          path: ./bicep

      - name: Azure login
        # azure/login@v2
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      # main.bicep needs the deploying principal's object id (it grants that principal access to
      # the Container Apps environment). The AppHost reads it from the access token's `oid` claim;
      # do the same here rather than calling Graph, which this identity has no permission for.
      - name: Resolve deploying principal
        run: |
          set -euo pipefail
          OID=$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv \
            | cut -d. -f2 | python3 -c 'import sys,base64,json; p=sys.stdin.read().strip(); print(json.loads(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4)))["oid"])')
          echo "PRINCIPAL_ID=$OID" >> "$GITHUB_ENV"

      # DRAWBACK #2: the data-service passwords are plain template PARAMETERS. `aspire deploy`
      # generates them, persists them to the password vault, and reads them back next time; this
      # path has none of that, so they're regenerated per run — which restarts cache and postgres
      # every deploy. They must be passed identically to all four app modules or the server won't
      # match its data services.
      - name: Generate data-service passwords
        run: |
          set -euo pipefail
          CACHE_PASSWORD=$(openssl rand -hex 16)
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$CACHE_PASSWORD"
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "CACHE_PASSWORD=$CACHE_PASSWORD" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> "$GITHUB_ENV"

      # main.bicep is SUBSCRIPTION-scoped: it creates the resource group and everything shared —
      # ACA environment, storage, key vault, identities, role assignments.
      #
      # DRAWBACK #3: the template's PARAMETER SURFACE is not stable. The AppHost probes Azure
      # while publishing, so whether the ACA environment already exists decides whether it is
      # created or referenced — and referencing it adds aca_env_name / aca_env_rg /
      # target_subscription parameters that a freshly-provisioned target doesn't have. A fixed
      # list of --parameters silently breaks the first time that flips. So: read the parameters
      # the template actually declares and supply exactly those, failing loudly on one we don't
      # know about.
      - name: Deploy infrastructure (main.bicep)
        run: |
          set -euo pipefail

          # Only needed when the ACA environment is referenced as existing — in which case it
          # exists, so ask Azure rather than hardcoding the AppHost's derived name.
          ACA_ENV_NAME=$(az containerapp env list -g "$RESOURCE_GROUP" --query "[0].name" -o tsv 2>/dev/null || true)

          value_for() {
            case "$1" in
              resourceGroupName)   echo "$RESOURCE_GROUP" ;;
              location)            echo "$LOCATION" ;;
              principalId)         echo "$PRINCIPAL_ID" ;;
              acr_name)            echo "$ACR_NAME" ;;
              acr_rg)              echo "$ACR_RG" ;;
              acr_subscription)    echo "$ACR_SUBSCRIPTION" ;;
              aca_env_name)        echo "$ACA_ENV_NAME" ;;
              aca_env_rg)          echo "$RESOURCE_GROUP" ;;
              target_subscription) echo "$TARGET_SUBSCRIPTION" ;;
              *)                   return 1 ;;
            esac
          }

          ARGS=()
          for name in $(az bicep build --file ./bicep/main.bicep --stdout | jq -r '.parameters | keys[]'); do
            if ! value=$(value_for "$name"); then
              echo "::error::main.bicep declares parameter '$name', which this workflow has no value for."
              exit 1
            fi
            if [ -z "$value" ]; then
              echo "::error::main.bicep needs parameter '$name' but the resolved value is empty."
              exit 1
            fi
            ARGS+=("$name=$value")
          done
          echo "Passing: ${ARGS[*]}"

          az deployment sub create \
            --name "aspire-prod-$BUILD_NUMBER" \
            --location "$LOCATION" \
            --template-file ./bicep/main.bicep \
            --parameters "${ARGS[@]}" \
            --query properties.outputs -o json > infra-outputs.json
          cat infra-outputs.json

      # DRAWBACK #4: main.bicep does NOT include the container apps. Aspire deploys each app as
      # its own resource-group-scoped deployment, wiring parameters from the outputs above — so
      # "just deploy the Bicep" is really five deployments, and this wiring is the part you own.
      - name: Deploy container apps
        run: |
          set -euo pipefail
          out() { jq -r ".$1.value" infra-outputs.json; }
          ENV_DOMAIN=$(out acaenv_AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN)
          ENV_ID=$(out acaenv_AZURE_CONTAINER_APPS_ENVIRONMENT_ID)
          REGISTRY_ENDPOINT=$(out acaenv_AZURE_CONTAINER_REGISTRY_ENDPOINT)
          REGISTRY_MI_ID=$(out acaenv_AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID)
          SERVER_IDENTITY_ID=$(out aspire_server_identity_id)
          SERVER_IDENTITY_CLIENT_ID=$(out aspire_server_identity_clientId)
          BLOB_ENDPOINT=$(out storage_blobEndpoint)

          # DRAWBACK #5: nothing here builds or pushes an image — it trusts that this tag exists.
          # It does, because `build-push` runs for every run of this workflow, staging or not.
          # Applying this artifact outside the workflow means guaranteeing that yourself.
          SERVER_IMAGE="$ACR_NAME.azurecr.io/aspire-server:$IMAGE_TAG"
          FRONTEND_IMAGE="$ACR_NAME.azurecr.io/aspire-webfrontend:$IMAGE_TAG"

          deploy_app() {
            local name=$1; shift
            echo "::group::$name"
            az deployment group create \
              --name "$name-$BUILD_NUMBER" \
              --resource-group "$RESOURCE_GROUP" \
              --template-file "./bicep/$name/$name.bicep" \
              --parameters \
                location="$LOCATION" \
                acaenv_outputs_azure_container_apps_environment_default_domain="$ENV_DOMAIN" \
                acaenv_outputs_azure_container_apps_environment_id="$ENV_ID" \
                "$@" \
              --query "properties.provisioningState" -o tsv
            echo "::endgroup::"
          }

          deploy_app aspire-cache-production \
            aspire_cache_production_password_value="$CACHE_PASSWORD"

          deploy_app aspire-postgres-production \
            aspire_postgres_production_password_value="$POSTGRES_PASSWORD"

          deploy_app aspire-server \
            aspire_server_containerimage="$SERVER_IMAGE" \
            aspire_server_containerport="$SERVER_CONTAINER_PORT" \
            aspire_server_identity_outputs_id="$SERVER_IDENTITY_ID" \
            aspire_server_identity_outputs_clientid="$SERVER_IDENTITY_CLIENT_ID" \
            aspire_cache_production_password_value="$CACHE_PASSWORD" \
            aspire_postgres_production_password_value="$POSTGRES_PASSWORD" \
            storage_outputs_blobendpoint="$BLOB_ENDPOINT" \
            acaenv_outputs_azure_container_registry_endpoint="$REGISTRY_ENDPOINT" \
            acaenv_outputs_azure_container_registry_managed_identity_id="$REGISTRY_MI_ID"

          deploy_app aspire-webfrontend \
            aspire_webfrontend_containerimage="$FRONTEND_IMAGE" \
            acaenv_outputs_azure_container_registry_endpoint="$REGISTRY_ENDPOINT" \
            acaenv_outputs_azure_container_registry_managed_identity_id="$REGISTRY_MI_ID"
